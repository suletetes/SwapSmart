      Name: !Sub ${AWS::StackName}-SwapSmartTable

  SwapSmartTableArn:
    Description: ARN of the primary DynamoDB table
    Value: !GetAtt SwapSmartTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-SwapSmartTableArn

  SwapSmartLedgerTableName:
    Description: Name of the wallet ledger DynamoDB table
    Value: !Ref SwapSmartLedgerTable
    Export:
      Name: !Sub ${AWS::StackName}-SwapSmartLedgerTable

  SwapSmartLedgerTableArn:
